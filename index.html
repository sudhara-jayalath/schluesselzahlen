<style>
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow column, one question at a time, like a form handed across a counter. Guess = brass (key metal), reality = brick. */
:root{
  --paper:#E4EAEC; --card:#F4F7F8; --ink:#13222C; --muted:#56666F; --line:#C2CDD2;

  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;

  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E181E; --card:#15222A; --ink:#E3EBEE; --muted:#93A4AD; --line:#2A3A44;
  --brass:#E6AE3E; --brick:#E2724F; --d1:#3A5361; --d2:#567282; --d3:#7D98A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E181E; --card:#15222A; --ink:#E3EBEE; --muted:#93A4AD; --line:#2A3A44;

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55}
.wrap{max-width:46rem;margin:0 auto;padding-inline:1.25rem;padding-block:1.25rem 3rem;display:flex;flex-direction:column;gap:2rem}
.mast{display:flex;justify-content:space-between;align-items:center;gap:.75rem 1rem;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.9rem}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase}
.mast-r{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.pips{display:flex;gap:.35rem}
.pip{width:1.6rem;height:.55rem;border-radius:.3rem .1rem .1rem .3rem;background:var(--line)}
.pip.done{background:var(--brass)}
.pip.now{background:var(--ink)}
.lang{display:flex;border-radius:.35rem;box-shadow:inset 0 0 0 1.5px var(--ink);overflow:hidden}
.lang button{font-family:var(--f-mono);font-size:.75rem;font-weight:500;letter-spacing:.06em;background:transparent;color:var(--ink);border:0;padding:.3rem .6rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline:3px solid var(--brass);outline-offset:-3px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap;margin:0}
h1,h2{font-family:var(--f-display);font-weight:800;text-wrap:balance;margin:0;line-height:1.02}
h1{font-size:clamp(2.8rem,9vw,4.8rem);text-transform:uppercase;letter-spacing:.01em;hyphens:auto}
h2{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:600;hyphens:auto}
p{margin:0;max-width:65ch}
.lede{font-size:1.15rem}
.small{font-size:.85rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:1.25rem}

/* intro tag */
.intro{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center}
.intro > *{min-width:0}
@media (max-width:640px){.intro{grid-template-columns:1fr}}
.tag{position:relative;width:15rem;max-width:100%;padding:2.6rem 1.4rem 1.4rem;background:var(--brass);color:var(--paper);border-radius:1.6rem .5rem .5rem .5rem;transform:rotate(-5deg);box-shadow:0 .6rem 1.5rem -1rem var(--ink)}
.tag::before{content:"";position:absolute;top:.9rem;left:1rem;width:1rem;height:1rem;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 2px var(--ink)}
.tag b{display:block;font-family:var(--f-display);font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.tag span{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}

/* buttons */
.btn{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);border:0;border-radius:.4rem;padding:.75rem 1.5rem;cursor:pointer;align-self:flex-start}
.btn:hover{background:var(--brick)}
.btn:disabled{opacity:.35;cursor:not-allowed;background:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible,input:focus-visible,svg:focus-visible{outline:3px solid var(--brass);outline-offset:3px}

/* guess dial */
.dial{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;color:var(--brass)}
.dial output{font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,14vw,6rem);line-height:.9;font-variant-numeric:tabular-nums}
.dial .unit{font-family:var(--f-mono);font-size:.95rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--brass);height:2rem;cursor:pointer}
.scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-top:-.75rem}

/* reveal */
.reveal{border-top:2px solid var(--ink);padding-top:1.5rem}
.verdict{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:baseline;font-family:var(--f-mono);font-size:.85rem}
.verdict .truth{font-family:var(--f-display);font-weight:800;font-size:3rem;color:var(--brick);line-height:1;font-variant-numeric:tabular-nums}
.verdict .pts{background:var(--brass);color:var(--paper);padding:.15rem .5rem;border-radius:.25rem;font-weight:500}
.panel{background:var(--card);border-radius:.6rem;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.key{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.key i{display:inline-block;width:.8rem;height:.8rem;border-radius:.15rem;vertical-align:-.1rem;margin-right:.35rem}
.key i.ring{background:transparent;box-shadow:inset 0 0 0 2px var(--brass)}

/* waffle of beds */
.waffle{display:grid;grid-template-columns:repeat(10,1fr);gap:.3rem;max-width:22rem}
.waffle span{aspect-ratio:1.6;border-radius:.2rem .5rem .2rem .2rem;background:var(--line);max-width:100%}
.waffle span.g{box-shadow:0 0 0 2px var(--brass)}

/* state bars */
.bars{display:grid;grid-template-columns:minmax(6.5rem,9rem) 1fr;gap:.25rem .75rem;font-size:.82rem;align-items:center}
.bars > *{min-width:0}
.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .tr{position:relative;height:1rem}
.bars .b{position:absolute;inset:0 auto 0 0;background:var(--d1);border-radius:0 .2rem .2rem 0;transition:width .6s}
.bars .b.hh{background:var(--brick)}
.bars .b.de{background:var(--ink)}
.bars .v{position:absolute;top:50%;transform:translate(.4rem,-50%);font-family:var(--f-mono);font-size:.72rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.bars .m{position:absolute;top:-.15rem;bottom:-.15rem;width:2px;background:var(--brass)}
.strong{font-weight:700}

/* chart */
.chartbox{overflow-x:auto}
svg.draw{width:100%;max-width:100%;height:auto;touch-action:none;display:block;background:var(--card);border-radius:.6rem;cursor:crosshair}
svg text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}

/* end */
.recap{display:grid;grid-template-columns:1fr auto auto auto;gap:.4rem 1rem;font-size:.88rem;font-variant-numeric:tabular-nums;align-items:baseline}
.recap > *{min-width:0}
.recap .h{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.recap .yg{color:var(--brass)} .recap .rl{color:var(--brick);font-weight:700}
.total{font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,14vw,6.5rem);line-height:.9;color:var(--brass)}
.total small{font-size:.4em;color:var(--muted)}
.actions{display:flex;gap:.75rem;flex-wrap:wrap}
h3{font-family:var(--f-display);font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
h4{font-size:1rem;margin:0}

/* hidden figures */
.hidden-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.9rem}
.hidden-list li{padding-left:1rem;border-left:3px solid var(--line);max-width:65ch}
.stackbar{display:flex;height:2.6rem;border-radius:.3rem;overflow:hidden}
.stackbar span{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:.8rem;font-weight:500;min-width:0;overflow:hidden;white-space:nowrap}
.sb-count{background:var(--brick);color:var(--paper)}
.sb-street{background:var(--d3);color:var(--paper)}
.sb-unknown{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--d2)}
.key i.hatch{background:repeating-linear-gradient(135deg,var(--d2) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--d2)}

/* what you can do */
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem}
.help > *{min-width:0}
.help .panel{gap:.6rem;justify-content:flex-start}
.help p{font-size:.9rem}
.help a{font-family:var(--f-mono);font-size:.78rem;color:var(--ink);text-decoration:underline;text-decoration-color:var(--brass);text-decoration-thickness:2px;text-underline-offset:3px;overflow-wrap:anywhere;margin-top:auto}
.help a:hover{color:var(--brick)}
.help a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.sharebox{width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:.85rem;line-height:1.5;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:.4rem;padding:.75rem;resize:none}
.sharebox:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.copied{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);min-height:1.2em}
.src{border-top:1px solid var(--line);padding-top:1rem;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:.4rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function pickLang(){
  const h = (location.hash||'').slice(1).toLowerCase();
  if(h==='de'||h==='en') return h;
  try{ const s = localStorage.getItem('hwak-lang'); if(s==='de'||s==='en') return s; }catch(e){}
  return (navigator.language||'').toLowerCase().startsWith('de') ? 'de' : 'en';
}
let LANG = pickLang();
const t = () => STR[LANG];
const loc = () => LANG==='de' ? 'de-DE' : 'en-US';
const num = (v,d=0) => (+v).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});
const pctStr = (v,d=0) => num(v,d) + (LANG==='de' ? ' %' : '%');

/* ---------- data ---------- */
const STATES = [["Hamburg",1.75,"hh"],["Berlin",1.56],["Schleswig-Holstein",0.98],["Baden-Württemberg",0.81],["Bremen",0.73],["Nordrhein-Westfalen",0.58],["@avg",0.54,"de"],["Hessen",0.42],["Niedersachsen",0.42],["Rheinland-Pfalz",0.37],["Bayern",0.31],["Saarland",0.29],["Brandenburg",0.18],["Sachsen",0.14],["Thüringen",0.13],["Sachsen-Anhalt",0.05],["Mecklenburg-Vorpommern",0.04]];
const YEARS = [2022,2023,2024,2025,2026];
const TRUE_LINE = [18915,32285,32615,32410,32765];
const YMAX = 50000;

function waffle(groups, guess){
  const cells = [];
  groups.forEach(g => { for(let j=0;j<g.n;j++) cells.push(g.color); });
  while(cells.length<100) cells.push('var(--line)');
  const gN = Math.round(guess);
  return `<div class="waffle" role="img" aria-label="${t().beds100}">${cells.map((c,i)=>`<span style="background:${c}" class="${i<gN?'g':''}"></span>`).join('')}</div>`;
}
const ring = () => `<span><i class="ring"></i>${t().yourGuess}</span>`;

const Q = [
 { id:'rate', min:0,max:6,step:0.05,start:0.5, fmt:v=>num(v,2), answer:1.75, tol:1.75,
   reveal(g,s){
     const max = Math.max(1.75,g)*1.08;
     const rows = STATES.map(([n,v,c])=>`<span class="nm ${c?'strong':''}">${n==='@avg'?t().avg:n}</span><div class="tr"><div class="b ${c||''}" style="width:${v/max*100}%"></div><span class="v" style="left:${v/max*100}%">${num(v,2)}</span><div class="m" style="left:${g/max*100}%"></div></div>`).join('');
     return `<p>${s.r}</p>
     <div class="panel"><div class="key"><span><i style="background:var(--brick)"></i>${s.hh}</span><span><i style="background:var(--ink)"></i>${t().avg}</span><span><i style="background:var(--brass)"></i>${t().yourGuess}</span></div><div class="bars">${rows}</div><p class="small">${s.cap}</p></div>`;

   reveal(g,s){
     return `<p>${s.r}</p>

   }},

   reveal(g,s){

     <div class="key"><span><i style="background:var(--brick)"></i>${s.a}</span><span><i style="background:var(--d1)"></i>${s.b}</span>${ring()}</div></div>`;
   }},
 { id:'trend', type:'line', tol:15000, reveal(g,s){ return `<p>${s.r}</p>`; } },
 { id:'beds', min:0,max:100,step:1,start:15, pct:true, answer:51.1, ansDec:1, tol:40,
   reveal(g,s){
     const c = ['var(--brick)','var(--d3)','var(--d2)','var(--d1)'];
     return `<p>${s.r}</p>
     <div class="panel">${waffle([{n:51,color:c[0]},{n:16,color:c[1]},{n:11,color:c[2]},{n:22,color:c[3]}],g)}
     <div class="key">${s.l.map((x,i)=>`<span><i style="background:${c[i]}"></i>${x}</span>`).join('')}${ring()}</div><p class="small">${s.cap}</p></div>`;
   }},
 { id:'eligible', min:0,max:32765,step:5,start:5000, fmt:v=>num(v), answer:29427, tol:20000,
   reveal(g,s){
     const w = 29427/32765*100, gw = Math.min(100,g/32765*100);

     <p class="small">${s.cap}</p></div>`;
   }},
];
// display helpers per question
const showVal = (q,v) => q.pct ? pctStr(v) : q.fmt(v);
const showAns = q => q.pct ? pctStr(q.answer, q.ansDec||0) : q.fmt(q.answer);
const unitOf = q => q.pct ? '' : (t().q[q.id].unit||'');

/* ---------- state ---------- */
const fresh = () => ({i:-1, guesses:{}, scores:{}, done:{}, line:[18915,null,null,null,null]});
let S = fresh();
const stage = document.getElementById('stage');

function chrome(){
  document.documentElement.lang = LANG;
  document.getElementById('brand').textContent = t().brand;
  document.getElementById('pips').setAttribute('aria-label', t().progress);
  document.getElementById('src').innerHTML = `<p>${t().src1}</p><p>${t().src2}</p>`;
  ['en','de'].forEach(l=>document.getElementById('lang-'+l).setAttribute('aria-pressed', String(l===LANG)));
}
function pips(){
  document.getElementById('pips').innerHTML = Q.map((q,k)=>`<span class="pip ${S.done[q.id]?'done':(k===S.i?'now':'')}" title="${t().q[q.id].k}"></span>`).join('');
}
function score(q,g){ return Math.round(100*Math.max(0,1-Math.abs(g-q.answer)/q.tol)); }

function render(keepScroll){
  chrome(); pips();
  if(S.i<0) intro();
  else if(S.i===Q.length) hiddenFigures();
  else if(S.i>Q.length) end();
  else { const q = Q[S.i]; q.type==='line' ? lineQ(q) : sliderQ(q); }
  if(!keepScroll) window.scrollTo({top:0});
}

function intro(){
  const T = t();
  stage.innerHTML = `<div class="intro">
    <div class="stack">
      <p class="eyebrow"><span>${T.eye1}</span><span>${T.eye2}</span></p>
      <h1>${T.h1}</h1>
      <p class="lede">${T.lede}</p>
      <button class="btn" id="go">${T.start}</button>
    </div>
    <div class="tag" aria-hidden="true"><b>${num(32765)}</b><span>wohnungslos · Hamburg · 2026</span></div>
  </div>`;
  document.getElementById('go').onclick = ()=>{S.i=0;render();};
}

function header(q){
  const s = t().q[q.id];
  return `<p class="eyebrow"><span>${t().qOf(S.i+1,Q.length)}</span><span>${s.k}</span></p><h2>${s.q}</h2>`;
}
function nextBtn(){ return `<button class="btn" id="next">${S.i===Q.length-1?t().cont:t().next}</button>`; }
function bindNext(){ document.getElementById('next').onclick=()=>{S.i++;render();}; }

function sliderQ(q){
  const done = S.done[q.id];
  const g = S.guesses[q.id] ?? q.start;
  stage.innerHTML = `<article class="stack">${header(q)}
    <div class="dial"><output id="val">${showVal(q,g)}</output><span class="unit">${unitOf(q)}</span></div>
    <input type="range" id="g-${q.id}" min="${q.min}" max="${q.max}" step="${q.step}" value="${g}" ${done?'disabled':''} aria-label="${t().yourGuess}">
    <div class="scale"><span>${showVal(q,q.min)}</span><span>${showVal(q,q.max)}</span></div>
    ${done?'':`<button class="btn" id="lock">${t().lock}</button>`}
    <div id="rev"></div></article>`;
  const inp = document.getElementById('g-'+q.id), out = document.getElementById('val');
  inp.oninput = ()=>{ S.guesses[q.id]=+inp.value; out.textContent=showVal(q,+inp.value); };
  const show = ()=>{
    const gv = S.guesses[q.id] ?? q.start;
    document.getElementById('rev').innerHTML = `<div class="reveal stack">
      <div class="verdict"><span class="truth">${showAns(q)}</span><span>${t().youSaid(showVal(q,gv))}</span><span class="pts">${t().pts(S.scores[q.id])}</span></div>
      ${q.reveal(gv, t().q[q.id])}${nextBtn()}</div>`;
    bindNext();
  };
  if(done) show();
  else document.getElementById('lock').onclick = ()=>{
    S.guesses[q.id] = +inp.value; S.scores[q.id]=score(q,+inp.value); S.done[q.id]=true;
    inp.disabled=true; document.getElementById('lock').remove(); pips(); show();
  };
}

/* ---------- line drawing question ---------- */
const W=600,H=290,L=58,R=20,T=18,B=34;
const xAt = i => L + i*(W-L-R)/4;
const yAt = v => T + (1-v/YMAX)*(H-T-B);
function lineSvg(user, truth){
  let s = '';
  for(let v=0; v<=YMAX; v+=10000){
    s += `<line x1="${L}" x2="${W-R}" y1="${yAt(v)}" y2="${yAt(v)}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${L-8}" y="${yAt(v)+4}" text-anchor="end">${num(v)}</text>`;
  }
  YEARS.forEach((y,i)=>{ s += `<text x="${xAt(i)}" y="${H-10}" text-anchor="middle">${y}</text>`; });
  if(!truth && user.slice(1).every(v=>v===null)){
    s += `<text x="${(xAt(1)+xAt(4))/2}" y="${yAt(42000)}" text-anchor="middle" style="fill:var(--brass);font-size:13px">${t().drag}</text>`;
  }
  const pts = []; for(let i=0;i<5;i++){ if(user[i]===null) break; pts.push([xAt(i),yAt(user[i])]); }
  if(pts.length>1) s += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--brass)" stroke-width="3" stroke-dasharray="${truth?'6 5':'0'}" stroke-linejoin="round"/>`;
  pts.forEach(p=> s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--brass)"/>`);
  if(truth){
    const tp = TRUE_LINE.map((v,i)=>[xAt(i),yAt(v)]);
    s += `<polygon points="${xAt(0)},${yAt(0)} ${tp.map(p=>p.join(',')).join(' ')} ${xAt(4)},${yAt(0)}" fill="var(--brick)" opacity=".12"/>`;
    s += `<polyline points="${tp.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--brick)" stroke-width="3.5" stroke-linejoin="round"/>`;
    tp.forEach((p,i)=>{ s += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--brick)"/><text x="${p[0]}" y="${p[1]+(i===0?20:-12)}" text-anchor="middle" style="fill:var(--ink);font-weight:500">${num(TRUE_LINE[i])}</text>`; });
  }
  return s;
}
const lineErr = () => Math.round(S.line.slice(1).reduce((a,v,i)=>a+Math.abs(v-TRUE_LINE[i+1]),0)/4);

function lineQ(q){
  const done = S.done[q.id];
  stage.innerHTML = `<article class="stack">${header(q)}
    <div class="chartbox"><svg class="draw" id="draw" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${t().drawAria}"></svg></div>
    <p class="small" id="hint">${done?'':t().hint}</p>
    ${done?'':`<button class="btn" id="lock" disabled>${t().lockLine}</button>`}
    <div id="rev"></div></article>`;
  const svg = document.getElementById('draw');
  const paint = ()=>{ svg.innerHTML = lineSvg(S.line, !!S.done[q.id]); const lk=document.getElementById('lock'); if(lk) lk.disabled = S.line.some(v=>v===null); };
  paint();
  const show = ()=>{
    document.getElementById('rev').innerHTML = `<div class="reveal stack"><div class="verdict"><span class="truth">${num(32765)}</span><span>${t().lineVerdict(num(lineErr()))}</span><span class="pts">${t().pts(S.scores[q.id])}</span></div>
      <div class="key"><span><i style="background:var(--brick)"></i>${t().counted}</span><span><i style="background:var(--brass)"></i>${t().yourLine}</span></div>${q.reveal(null, t().q[q.id])}${nextBtn()}</div>`;
    bindNext();
  };
  if(done){ svg.style.cursor='default'; show(); return; }
  let down=false, sel=1;
  const setAt = (idx,val)=>{
    val = Math.max(0,Math.min(YMAX,val));
    S.line[idx]=val;
    let prev = idx-1; while(prev>0 && S.line[prev]===null) prev--;
    for(let k=prev+1;k<idx;k++) S.line[k] = S.line[prev] + (val-S.line[prev])*(k-prev)/(idx-prev);
    paint();
  };
  const fromEvent = e=>{
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX-r.left)/r.width*W, sy=(e.clientY-r.top)/r.height*H;
    const idx = Math.max(1,Math.min(4,Math.round((sx-L)/((W-L-R)/4))));
    setAt(idx, Math.round((1-(sy-T)/(H-T-B))*YMAX/50)*50);
  };
  svg.onpointerdown = e=>{down=true; svg.setPointerCapture(e.pointerId); fromEvent(e);};
  svg.onpointermove = e=>{ if(down) fromEvent(e); };
  svg.onpointerup = svg.onpointercancel = ()=>{down=false;};
  svg.onkeydown = e=>{
    if(e.key==='ArrowLeft'){sel=Math.max(1,sel-1);e.preventDefault();}
    else if(e.key==='ArrowRight'){sel=Math.min(4,sel+1);e.preventDefault();}
    else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      const cur = S.line[sel] ?? S.line[sel-1] ?? 18915;
      setAt(sel, cur + (e.key==='ArrowUp'?1000:-1000)); e.preventDefault();
    }
  };
  document.getElementById('lock').onclick = ()=>{
    S.scores[q.id] = Math.round(100*Math.max(0,1-lineErr()/q.tol)); S.done[q.id]=true;
    document.getElementById('lock').remove(); document.getElementById('hint').textContent='';
    svg.onpointerdown=svg.onpointermove=svg.onkeydown=null; svg.style.cursor='default';
    pips(); paint(); show();
  };
}

function end(){
  const T = t();
  const total = Q.reduce((a,q)=>a+(S.scores[q.id]||0),0);
  const label = T.bands[total>=480?0:total>=300?1:2];
  const rows = Q.map(q=>{
    let yg, rl;

    else { yg = showVal(q, S.guesses[q.id]??q.start); rl = showAns(q); }
    return `<span>${T.q[q.id].k}</span><span class="yg">${yg}</span><span class="rl">${rl}</span><span>${S.scores[q.id]||0}</span>`;
  }).join('');
  stage.innerHTML = `<article class="stack">
    <p class="eyebrow"><span>${T.yourResult}</span></p>
    <div class="total">${total}<small> / 600</small></div>
    <h2>${label}</h2>
    <div class="panel"><div class="recap">${T.rh.map(h=>`<span class="h">${h}</span>`).join('')}${rows}</div></div>
    <p>${T.summary}</p>
    <section class="stack" aria-labelledby="help-h">

      <div class="help">${T.help.map(h=>`<div class="panel"><h4>${h.t}</h4><p>${h.p}</p><a href="${h.u}" target="_blank" rel="noopener">${h.l} ↗</a></div>`).join('')}</div>
    </section>
    <section class="stack" aria-labelledby="share-h">
      <h3 id="share-h">${T.shareTitle}</h3>
      <textarea class="sharebox" id="share-text" rows="4" readonly aria-labelledby="share-h">${T.shareText(total)}</textarea>
      <div class="actions"><button class="btn" id="copy">${T.copy}</button><button class="btn ghost" id="again">${T.again}</button></div>
      <p class="copied" id="copied" aria-live="polite"></p>
    </section>
  </article>`;
  document.getElementById('copy').onclick = copyShare;
  document.getElementById('again').onclick=()=>{S=fresh(); S.i=0; render();};
}

/* ---------- language switch ---------- */
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{
  LANG = b.dataset.l;
  try{ localStorage.setItem('hwak-lang', LANG); }catch(e){}
  render(true);
});

function start(data){ if(data && data.S) S = data.S; if(data && data.LANG) LANG = data.LANG; render(); }
window.claude?.hot?.snapshot?.(()=>({S, LANG}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
